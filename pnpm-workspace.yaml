# ── PNPM Workspace Configuration ──
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
onlyBuiltDependencies:
  - simple-git-hooks

overrides:
  js-yaml: 4.3.2
  # 安全修复 GHSA-q2hr-2g5m-vwhr：<5.0.12 存在 CPU DoS；minimatch@10 允许 ^5.0.8，显式固定 5.x 线
  "brace-expansion@^5.0.0": 5.0.12
  # 安全修复：minimatch <11.0.1 存在 globparts 放大 DoS
  minimatch: ^11.0.1
  # 安全修复：zod <4.6.6 校验超大受限集合时可耗尽内存
  "zod@^4.0.0": ^4.6.7
